services:
  - type: web
    name: kaba-digital
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VITE_APP_TITLE
        value: Kaba — Immobilier premium au Sénégal
      - key: VITE_APP_LOGO
        value: /assets/kaba/icon-kaba.webp
      - key: OWNER_NAME
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
